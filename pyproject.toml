[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "pybind11>=2.11",
    "cmake>=3.14",
]
build-backend = "setuptools.build_meta"

[project]
name = "flashtrie"
dynamic = ["version"]
description = "GPU-accelerated constrained beam search for generative retrieval"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT AND (BSD-2-Clause OR LGPL-2.1-or-later)"
license-files = ["COPYING.md", "LICENSE-MIT"]
authors = [
    { name = "Dakshitha Anandakumar" },
    { name = "Anurag Mukkara" },
]
keywords = ["trie", "beam-search", "generative-retrieval", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
examples = ["numpy"]

[project.urls]
Homepage = "https://github.com/Dakshitha-BA/flash-trie"
Paper = "https://arxiv.org/abs/2607.10044"
Changelog = "https://github.com/Dakshitha-BA/flash-trie/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["python"]
