name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
            echo "Update VERSION and CHANGELOG.md, then tag v\${VERSION}."
            exit 1
          fi

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install this release:"
            echo
            echo '```bash'
            echo "pip install \"flashtrie @ git+https://github.com/Dakshitha-BA/flash-trie.git@${GITHUB_REF_NAME}\""
            echo '```'
            echo
            echo "The CUDA extension compiles on the machine that installs it. See CHANGELOG.md."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "flashtrie ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
